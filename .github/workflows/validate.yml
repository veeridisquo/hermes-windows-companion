name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell-syntax:
    name: PowerShell syntax
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          Get-ChildItem -Path . -Filter '*.ps1' -File | ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref]$tokens,
                  [ref]$errors
              ) | Out-Null

              foreach ($parseError in $errors) {
                  Write-Error "$($_.Name):$($parseError.Extent.StartLineNumber): $($parseError.Message)"
              }
          }

  script-analyzer:
    name: Script analyzer
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: Install-Module -Name PSScriptAnalyzer -Repository PSGallery -Scope CurrentUser -Force

      - name: Analyze PowerShell scripts
        shell: powershell
        run: |
          # Pester makes BeforeAll variables visible to Its at runtime, but PSUseDeclaredVarsMoreThanAssignments is lexical.
          $paths = @(Get-ChildItem -Path $PWD -Filter '*.ps1' -File -Recurse | Where-Object {
              $_.FullName -notlike "$($PWD)\tests\*"
          })
          Write-Host "Analyzing $($paths.Count) PowerShell script(s)."
          if ($paths.Count -eq 0) {
              throw 'No PowerShell scripts found to analyze.'
          }

          $findings = @()
          foreach ($path in $paths) {
              $findings += @(Invoke-ScriptAnalyzer -Path $path.FullName -Settings (Join-Path $PWD 'PSScriptAnalyzerSettings.psd1'))
          }

          foreach ($finding in $findings) {
              Write-Host "$($finding.ScriptName):$($finding.Line):$($finding.Column) [$($finding.Severity)] $($finding.RuleName): $($finding.Message)"
          }

          $failures = @($findings | Where-Object { $_.Severity -in @('Error', 'Warning') })
          if ($failures.Count -gt 0) {
              throw "PSScriptAnalyzer found $($failures.Count) error(s) or warning(s)."
          }

  parser-tests:
    name: Parser tests
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Pester
        shell: powershell
        run: Install-Module -Name Pester -MinimumVersion 5.0.0 -Repository PSGallery -Scope CurrentUser -Force

      - name: Run parser tests
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.0.0 -Force
          $result = Invoke-Pester -Path .\tests -PassThru
          if ($result.FailedCount -gt 0) {
              throw "Pester reported $($result.FailedCount) failed test(s)."
          }
